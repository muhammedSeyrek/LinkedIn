# Cloud Build Configuration
# LinkedIn Job Scraper için otomatik build ve deploy

steps:
  # Step 1: Docker image build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:latest'
      - '.'
    timeout: 1800s

  # Step 2: Docker image push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'linkedin-job-scraper'
      - '--image'
      - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'SELENIUM_HEADLESS=True,MAX_PAGES_LIMIT=10,MAX_CONCURRENT_JOBS=2'

# Build timeout
timeout: 3600s

# Images to be pushed
images:
  - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/linkedin-job-scraper:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Substitutions (optional)
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'linkedin-job-scraper'
